<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invert</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <span class="icon" aria-hidden="true">◐</span>
      <div>
        <h1>Invert</h1>
        <p>Every color. Every page.</p>
      </div>
    </div>
    <label class="switch-row" for="enabled">
      <span>
        <strong>Invert colors</strong>
        <small id="status" role="status">Loading…</small>
      </span>
      <input id="enabled" type="checkbox" role="switch" checked>
    </label>
    <p class="hint">Changes apply to all open tabs and new pages.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
